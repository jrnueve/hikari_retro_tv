# Hikari Retro TV (Pi Zero W) - configuracion. Se instala en /etc/hikari-tv/.
# Formato CLAVE=valor; las claves nuevas se agregan solas al desplegar.

# Categorias: un .m3u por categoria (las sube desplegar.sh)
DIR_CANALES=/home/pi/.local/share/hikari-tv/canales
# Categoria del primer arranque (despues manda la ultima elegida)
CATEGORIA_INICIAL=pruebas

# Salida de audio ALSA (PWM por GPIO19 + filtro RC)
ALSA=plughw:0,0
# Buffer entre la descarga y la reproduccion; arranca al BUFFER_PORC %.
# 3M es ~13 s a 1.8 Mbps: la imagen aparece a los ~8 s.
BUFFER=3M
BUFFER_PORC=60
# 16:9 en el TV 4:3: bandas (proporcion correcta) o estirar
ASPECTO=bandas

# Web app
PUERTO=8080
# Segundos por canal en modo azar, si no se eligio en la web
AZAR_SEGUNDOS=300
